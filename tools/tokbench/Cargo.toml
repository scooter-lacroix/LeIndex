[package]
name = "tokbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
# The LEINDEX arm calls the real MCP tool handlers in-process through the
# library. This is the same public surface `benches/mcp_tool_latency.rs` uses;
# `handle_tool_call` is exactly what the MCP stdio/SSE transport dispatches to
# (router resolution, tier handling, payload trimming, plain-text rendering),
# so the captured text is what the model would see — without paying one
# process spawn per call, and without `leindex tools run`'s colored CLI
# renderer, which is byte-different from the wire format.
leindex = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.13"
sha2 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]

# Inherits workspace lint policy from the root Cargo.toml
# `[workspace.lints.clippy]` table.
[lints]
workspace = true
