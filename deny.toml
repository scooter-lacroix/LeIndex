# cargo-deny config — used by the CI `Security / Dependency Vulnerability Scan`
# workflow (EmbarkStudios/cargo-deny-action). The action defaults to
# `--all-features`, so this config is evaluated against the *widest* dependency
# graph the workspace can produce, not just the default build.

[advisories]
version = 2

# No advisory is currently suppressed. Every RUSTSEC id that previously needed
# an entry here is resolved at the source:
#
#   bytes (RUSTSEC-2026-0007), anyhow (2026-0190), memmap2 (2026-0186),
#   rand (2026-0097, both 0.8 + 0.9), lru (2026-0002, bumped 0.12 -> 0.16)
#     -> fixed via `cargo update`.
#
#   rustls-webpki 0.102 (RUSTSEC-2026-0049 / -0098 / -0099 / -0104) and
#   h2 0.3.x (RUSTSEC-2026-0258)
#     -> all four webpki ids and the h2 id entered the graph *only* through the
#        opt-in `turso` feature's unused `libsql` dependency
#        (libsql -> tonic 0.11 -> hyper 0.14 -> h2 0.3.x, and
#        libsql -> rustls 0.22 -> webpki 0.102). No module referenced the
#        `libsql` API, so the dependency was dropped outright (see the `turso`
#        feature comment in Cargo.toml). That removed 73 crates from the graph,
#        including every crate these ids matched — no suppression required.
#        h2 is the sharper case: the advisory's only patched range is
#        >= 0.4.16, and hyper 0.14 pins h2 0.3.x, so the id was unfixable while
#        the dependency existed.
#
# Do not re-add an ignore for a transitive advisory: either update the crate,
# or remove the (unused) dependency that drags it in.
ignore = []
# Parity with prior cargo-audit behavior: unmaintained crates are reported but
# do not fail the gate.
unmaintained = "none"

# --- Deliberate exception to the AGENTS.md:60 3-day release-age rule ---------
#
# RUSTSEC-2026-0382 (rustls-webpki < 0.103.16) and RUSTSEC-2026-0381
# (webpki-roots < 1.0.10) both cover versions this tree shipped, reached through
# the real runtime path `remote-embeddings` -> reqwest -> rustls -> webpki, so
# neither the "remove the unused dependency" escape nor an `ignore` entry
# applies — the crates are load-bearing and the advisories are live.
#
# Both advisories concern the same defect: certificate paths through distrusted
# emSign intermediates are accepted where the trust anchors allow it, and the
# corresponding private keys are now public. The only fix is the version bump,
# but the patched releases are younger than the 3-day minimum:
#
#   rustls-webpki 0.103.16  published 2026-10-20T08:58:28Z  (~14h at the bump)
#   webpki-roots  1.0.10    published 2026-10-19T20:11:32Z  (~27h at the bump)
#
# Resolved by explicit owner decision to prefer the security patch over the
# cooling-off window, since the alternative was shipping a known-bad TLS
# validator to satisfy a supply-chain heuristic. Both versions were fetched
# from crates.io directly and verified to be the advisory's named fixes, not
# pre-releases. No `--all-features`-only or dev-only path is involved.
#
# This exception needs NO suppression entry: the bump to the patched versions
# resolves both ids outright, so `ignore` above stays empty. This note is the
# audit trail for landing them inside the cooling-off window.
