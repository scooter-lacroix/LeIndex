# cargo-deny config — used by the CI `Security / Dependency Vulnerability Scan`
# workflow (EmbarkStudios/cargo-deny-action). The action defaults to
# `--all-features`, so this config is evaluated against the *widest* dependency
# graph the workspace can produce, not just the default build.

[advisories]
version = 2

# No advisory is currently suppressed. Every RUSTSEC id that previously needed
# an entry here is resolved at the source:
#
#   bytes (RUSTSEC-2026-0007), anyhow (2026-0190), memmap2 (2026-0186),
#   rand (2026-0097, both 0.8 + 0.9), lru (2026-0002, bumped 0.12 -> 0.16)
#     -> fixed via `cargo update`.
#
#   rustls-webpki 0.102 (RUSTSEC-2026-0049 / -0098 / -0099 / -0104) and
#   h2 0.3.x (RUSTSEC-2026-0258)
#     -> all four webpki ids and the h2 id entered the graph *only* through the
#        opt-in `turso` feature's unused `libsql` dependency
#        (libsql -> tonic 0.11 -> hyper 0.14 -> h2 0.3.x, and
#        libsql -> rustls 0.22 -> webpki 0.102). No module referenced the
#        `libsql` API, so the dependency was dropped outright (see the `turso`
#        feature comment in Cargo.toml). That removed 73 crates from the graph,
#        including every crate these ids matched — no suppression required.
#        h2 is the sharper case: the advisory's only patched range is
#        >= 0.4.16, and hyper 0.14 pins h2 0.3.x, so the id was unfixable while
#        the dependency existed.
#
# Do not re-add an ignore for a transitive advisory: either update the crate,
# or remove the (unused) dependency that drags it in.
ignore = []
# Parity with prior cargo-audit behavior: unmaintained crates are reported but
# do not fail the gate.
unmaintained = "none"
