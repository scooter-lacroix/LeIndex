# Issue Labels for LeIndex
#
# This file defines the comprehensive label system used across issues and PRs.
# Labels follow a `type:priority:area` taxonomy for programmatic filtering.
#
# To install these labels on a new repo, use:
#   gh label create "P0-critical" --description "Critical priority" --color B60205
#   gh label create "P1-high" --description "High priority" --color D93F0B
#   ... etc.
#
# Or use a tool like https://github.com/endoflife-date/everyonebot

# ── Priority Labels ─────────────────────────────────────────────────
- name: "P0-critical"
  color: "B60205"
  description: "Critical: blocks release, data loss, or security vulnerability"
- name: "P1-high"
  color: "D93F0B"
  description: "High: should be fixed before next release"
- name: "P2-medium"
  color: "FBCA04"
  description: "Medium: should be fixed in the current milestone"
- name: "P3-low"
  color: "0E8A16"
  description: "Low: backlog item, no urgency"

# ── Type Labels ─────────────────────────────────────────────────────
- name: "type:bug"
  color: "EE0701"
  description: "Something is not working correctly"
- name: "type:feature"
  color: "84B6EB"
  description: "New feature or enhancement request"
- name: "type:perf"
  color: "FBCA04"
  description: "Performance improvement"
- name: "type:docs"
  color: "0075CA"
  description: "Documentation improvement"
- name: "type:refactor"
  color: "1D76DB"
  description: "Code refactoring (no functional change)"
- name: "type:test"
  color: "0E8A16"
  description: "Test improvements or new test coverage"
- name: "type:ci"
  color: "5319E7"
  description: "CI/CD pipeline changes"
- name: "type:chore"
  color: "C5DEF5"
  description: "Maintenance task, tooling, or dependency update"
- name: "type:security"
  color: "B60205"
  description: "Security-related issue or fix"

# ── Area Labels ─────────────────────────────────────────────────────
- name: "area:parse"
  color: "C2E0C6"
  description: "Tree-sitter parsing module"
- name: "area:graph"
  color: "C2E0C6"
  description: "PDG / dependency graph module"
- name: "area:search"
  color: "C2E0C6"
  description: "Search engine and vector search"
- name: "area:storage"
  color: "C2E0C6"
  description: "SQLite/libSQL storage layer"
- name: "area:cli"
  color: "C2E0C6"
  description: "Command-line interface"
- name: "area:mcp"
  color: "C2E0C6"
  description: "MCP server and tool handlers"
- name: "area:edit"
  color: "C2E0C6"
  description: "Code editing and file operations"
- name: "area:onnx"
  color: "C2E0C6"
  description: "ONNX neural embeddings integration"
- name: "area:dashboard"
  color: "C2E0C6"
  description: "Dashboard web UI"
- name: "area:packaging"
  color: "C2E0C6"
  description: "npm, PyPI, crates.io packaging"
- name: "area:infra"
  color: "C2E0C6"
  description: "CI/CD, release pipeline, infrastructure"

# ── State Labels ────────────────────────────────────────────────────
- name: "state:blocked"
  color: "5319E7"
  description: "Blocked by another issue or external dependency"
- name: "state:needs-triage"
  color: "FBCA04"
  description: "Needs initial review and label assignment"
- name: "state:good-first-issue"
  color: "7057FF"
  description: "Good for newcomers"
- name: "state:help-wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "state:wontfix"
  color: "FFFFFF"
  description: "This will not be worked on"
