name: Documentation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Automated API documentation generation ──────────────────────────
  # Builds Rust API docs from doc comments and checks for broken
  # intra-doc links. Publishes docs as a GitHub Pages artifact.
  api-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustdoc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: docs-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            docs-cargo-
      - name: Generate API documentation
        run: |
          cargo doc --workspace --no-deps --all-features \
            -Z unstable-options \
            --output-format html \
            2>&1 | tee docs-build.log || true
          # Check for broken intra-doc links (warnings)
          if grep -q "warning: unresolved link" docs-build.log; then
            echo "::warning::Broken intra-doc links detected"
          fi
      - name: Check CLI help text generation
        run: |
          # Verify the CLI binary can generate help text without errors
          cargo build --features cli --release 2>/dev/null || true
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/doc/

  # ── AGENTS.md validation ────────────────────────────────────────────
  # Validates that commands referenced in AGENTS.md are valid by
  # running a subset of them, and checks for broken markdown links.
  agents-md-validation:
    name: Validate AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: agents-md-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            agents-md-cargo-

      # Validate key commands referenced in AGENTS.md actually work
      - name: Validate AGENTS.md commands
        run: |
          set -e
          echo "Verifying commands referenced in AGENTS.md..."

          # Check cargo fmt (referenced in AGENTS.md)
          echo "Testing: cargo fmt --all --check"
          cargo fmt --all --check

          # Check cargo clippy (referenced in AGENTS.md)
          echo "Testing: cargo clippy --workspace --all-targets"
          cargo clippy --workspace --all-targets -- -D warnings

          # Check cargo test (referenced in AGENTS.md)
          echo "Testing: cargo test --workspace"
          cargo test --workspace --quiet

          echo "All AGENTS.md commands validated successfully."

      # Check markdown links in AGENTS.md and CONTRIBUTING.md
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress AGENTS.md CONTRIBUTING.md README.md
          fail: false
