name: Quality Gates

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Compile-oriented feature matrix (Linux) ─────────────────────────
  # One published crate, two binaries. Statically verify each feature
  # combination still compiles and links its test targets without running
  # runtime ONNX tests (no ORT shared libs / models in CI). The onnx row
  # also checks the legacy onnx-migraphx alias so a stale feature gate is
  # caught here, not at release time.
  compile-matrix:
    name: Compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, args: "" }
          - { name: minimal, args: "--no-default-features --features minimal" }
          - { name: onnx-install-path, args: "--no-default-features --features onnx" }
          - { name: all-features, args: "--all-features" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: compile-${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            compile-${{ matrix.name }}-cargo-
      - name: cargo check
        run: cargo check -p leindex --all-targets ${{ matrix.args }}
      - name: cargo test --no-run (compile tests, do not execute runtime ONNX)
        run: cargo test -p leindex --no-run ${{ matrix.args }}
      - name: Also check legacy onnx-migraphx alias (onnx row only)
        if: matrix.name == 'onnx-install-path'
        run: cargo check -p leindex --no-default-features --features onnx-migraphx

  # ── CoreML compile check (macOS, no GPU runner) ─────────────────────
  # macOS has no self-hosted GPU runner in this repo; we only verify the
  # strict onnx feature set (which carries ort/coreml) compiles on Darwin.
  compile-macos-coreml:
    name: Compile (macOS CoreML)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: compile-macos-coreml-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            compile-macos-coreml-cargo-
      - name: cargo check (strict onnx, includes ort/coreml)
        run: cargo check -p leindex --no-default-features --features onnx --all-targets

  # ── Duplicate code detection via jscpd ──────────────────────────────
  # Uses jscpd to detect copy-paste code blocks across the Rust source.
  # Threshold: fail if duplication exceeds the staged 8% baseline; reduce toward 5%.
  duplicate-code:
    name: Duplicate Code Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run jscpd duplicate detection
        # Baseline: tree is at ~7.3% after the parser-framework dedup (CfgBuilder
        # macro, shared calculate_complexity, clean_call_text, handle_loop). The
        # remaining duplication is dominated by per-language parser specialization
        # (find_calls, extract_*_definitions, build_cfg_recursive dispatch) which is
        # intentionally preserved for parser accuracy. Non-parser clusters (hnsw,
        # config, test fixtures) are the next reduction target. Staged plan:
        # 8% (current) -> 6% (non-parser dedup) -> 5% (long-term).
        run: |
          npx --yes jscpd@3.5.10 \
            src/ \
            --format "rust" \
            --min-lines 6 \
            --min-tokens 50 \
            --threshold 8 \
            --reporters "console,html" \
            --output ./jscpd-report
      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: ./jscpd-report/

  # ── Cyclomatic complexity monitoring via lizard ────────────────────
  # Runs lizard to analyze cyclomatic complexity across all Rust source.
  # Fails if any function exceeds CCN of 15.
  cyclomatic-complexity:
    name: Cyclomatic Complexity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lizard
        run: pip install lizard jinja2  # jinja2 required for lizard's HTML report (-o)
      - name: Run complexity analysis
        run: |
          # Generate the browsable HTML report (lizard -o always exits 0).
          # The worker source lives at src/embed/ (the leindex-embed subcrate
          # was retired into the root crate), so src/ covers the full tree.
          lizard \
            src/ \
            -C 15 \
            -x"*/tests/*" \
            -x"*/target/*" \
            -m \
            -o ./complexity-report.html
          # Enforce the gate: -i 0 makes lizard exit non-zero on any CCN > 15
          # (lizard's -o report mode always exits 0, so the gate is a separate run).
          lizard \
            src/ \
            -C 15 \
            -x"*/tests/*" \
            -x"*/target/*" \
            -m \
            -i 0 \
            || (echo "::error::Cyclomatic complexity threshold exceeded (CCN > 15)" && exit 1)
      - name: Upload complexity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complexity-report
          path: ./complexity-report.html

  # ── Large file detection ───────────────────────────────────────────
  # Fails if any tracked source file exceeds 2000 lines or 1MB.
  large-file-check:
    name: Large File Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for large files
        run: |
          set -e
          MAX_LINES=2000
          MAX_SIZE_KB=1024
          FOUND_ISSUE=0

          # Check .rs files for line count violations
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt "$MAX_LINES" ]; then
              echo "::warning file=$file::Large file: ${lines} lines (max ${MAX_LINES})"
              FOUND_ISSUE=1
            fi
          done < <(find src -name '*.rs' -not -path '*/target/*' 2>/dev/null)

          # Check all source files for size violations (excluding target, node_modules, .git, models)
          while IFS= read -r file; do
            size_kb=$(( $(stat --format=%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo 0) / 1024 ))
            if [ "$size_kb" -gt "$MAX_SIZE_KB" ]; then
              echo "::warning file=$file::Large file: ${size_kb}KB (max ${MAX_SIZE_KB}KB)"
              FOUND_ISSUE=1
            fi
          done < <(find . -type f -not -path './target/*' -not -path './.git/*' -not -path './node_modules/*' -not -path './models/*' -not -name '*.onnx' -not -name '*.bin' 2>/dev/null)

          if [ "$FOUND_ISSUE" -eq 1 ]; then
            echo "::error::Large file(s) detected. Consider splitting files > ${MAX_LINES} lines or > ${MAX_SIZE_KB}KB."
            exit 1
          fi
          echo "No large files detected."

  # ── Unused dependencies detection ──────────────────────────────────
  # Runs cargo-udeps (nightly) to detect unused dependencies.
  # This job is non-blocking (continue-on-error) since cargo-udeps
  # requires nightly and may have false positives with optional deps.
  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: udeps-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            udeps-cargo-
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked || true
      - name: Run cargo-udeps
        run: |
          cargo +nightly udeps --workspace --all-targets --all-features 2>&1 | tee udeps-report.txt
          if grep -q "unused" udeps-report.txt; then
            echo "::warning::Unused dependencies detected (non-blocking)"
          fi

  # ── Version drift detection ────────────────────────────────────────
  # Verifies all workspace members use consistent dependency versions.
  version-drift:
    name: Version Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace dependency version consistency
        run: |
          # NOTE: the default `run` shell applies `set -e`, so EVERY command
          # below is explicitly guarded (`|| true`, `&&`, or an `if`/`[ ]` test)
          # so the script always reaches its own ERRORS-based exit. The
          # workspace is now one root crate + `tools/*` (the `crates/leindex-
          # embed` subcrate was retired); the `|| true` also keeps this robust
          # if a member dir is ever absent. Exit 1 only on genuine drift.
          MEMBER_FILES=$(find tools -name Cargo.toml 2>/dev/null || true)
          ERRORS=0

          # Collect all external dependency versions across workspace members
          declare -A ROOT_VERSIONS
          # Parse root Cargo.toml dependencies
          while IFS= read -r line; do
            dep_name=$(echo "$line" | sed -n 's/^\([a-zA-Z0-9_-]*\).*/\1/p')
            dep_ver=$(echo "$line" | grep -oP 'version\s*=\s*"\K[^"]+' || true)
            if [ -n "$dep_name" ] && [ -n "$dep_ver" ]; then
              ROOT_VERSIONS["$dep_name"]="$dep_ver"
            fi
          done < <(sed -n '/^\[dependencies\]/,/^\[/p' Cargo.toml | grep -v '^\[' | grep -v '^#')

          # Check workspace members for version mismatches
          for member in $MEMBER_FILES; do
            while IFS= read -r line; do
              dep_name=$(echo "$line" | sed -n 's/^\([a-zA-Z0-9_-]*\).*/\1/p')
              [ -z "$dep_name" ] && continue
              dep_ver=$(echo "$line" | grep -oP 'version\s*=\s*"\K[^"]+' || true)
              [ -z "$dep_ver" ] && continue
              root_ver="${ROOT_VERSIONS[$dep_name]:-}"
              if [ -n "$root_ver" ] && [ "$dep_ver" != "$root_ver" ]; then
                echo "::warning file=$member::Dependency '$dep_name' version drift: member=$dep_ver root=$root_ver"
                ERRORS=$((ERRORS + 1))
              fi
            done < <(sed -n '/^\[dependencies\]/,/^\[/p' "$member" | grep -v '^\[' | grep -v '^#')
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::warning::$ERRORS dependency version mismatches found across workspace members"
            exit 1
          fi
          echo "All workspace member dependency versions are consistent."

  # ── Test coverage thresholds ───────────────────────────────────────
  # Runs cargo-tarpaulin to measure test coverage and enforce a minimum.
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tarpaulin-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            tarpaulin-cargo-
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin || true
      - name: Run cargo-tarpaulin
        run: |
          cargo tarpaulin \
            --workspace \
            --out Xml \
            --output-dir ./coverage \
            --timeout 300 \
            --fail-under 40 \
            --exclude-files "benches/*" "tools/*" \
            2>&1 | tee coverage-output.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/

  # ── Flaky test detection ───────────────────────────────────────────
  # Runs the test suite 5 times to detect intermittent failures.
  # Only runs on push to master (not PRs) to conserve CI minutes.
  flaky-test-detection:
    name: Flaky Test Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: flaky-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            flaky-cargo-
      - name: Run tests 5 times to detect flakiness
        run: |
          FAIL=0
          for i in 1 2 3 4 5; do
            echo "--- Run $i ---"
            if ! cargo test --workspace --quiet 2>&1 | tee "run-$i.log"; then
              echo "::warning::Test run $i failed"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Flaky tests detected - at least one of 5 runs failed"
            exit 1
          fi
          echo "All 5 test runs passed. No flakiness detected."

  # ── Heavy dependency detection ─────────────────────────────────────
  # Uses cargo-bloat to identify dependencies that bloat the binary.
  heavy-dependency-detection:
    name: Heavy Dependency Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bloat-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bloat-cargo-
      - name: Install cargo-bloat
        run: cargo install cargo-bloat || true
      - name: Analyze binary size contributions
        run: |
          cargo bloat --release --crates --workspace 2>&1 | tee bloat-report.txt || true
          # Flag any single crate consuming more than 10% of binary
          if grep -E '\s+[0-9]+\.[0-9]%\s+' bloat-report.txt | awk '{if ($1+0 > 10) print $0}' | grep -q .; then
            echo "::warning::A single dependency consumes more than 10% of binary size"
            grep -E '\s+[0-9]+\.[0-9]%\s+' bloat-report.txt | awk '{if ($1+0 > 10) print $0}'
          else
            echo "No single dependency dominates binary size."
          fi

  # ── Tech debt tracking ─────────────────────────────────────────────
  # Counts TODO, FIXME, HACK, and XXX markers across the codebase.
  # Tracks accumulation over time. Does not fail CI (informational).
  tech-debt-tracking:
    name: Tech Debt Tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count tech debt markers
        run: |
          TODO=$(grep -rIn --include='*.rs' 'TODO' src/ 2>/dev/null | wc -l)
          FIXME=$(grep -rIn --include='*.rs' 'FIXME' src/ 2>/dev/null | wc -l)
          HACK=$(grep -rIn --include='*.rs' 'HACK' src/ 2>/dev/null | wc -l)
          XXX=$(grep -rIn --include='*.rs' 'XXX' src/ 2>/dev/null | wc -l)
          TOTAL=$((TODO + FIXME + HACK + XXX))
          echo "::notice::Tech debt markers: TODO=$TODO FIXME=$FIXME HACK=$HACK XXX=$XXX Total=$TOTAL"
          echo "Tech debt markers tracked: TODO=$TODO FIXME=$FIXME HACK=$HACK XXX=$XXX Total=$TOTAL" > tech-debt-report.txt
      - name: Upload tech debt report
        uses: actions/upload-artifact@v4
        with:
          name: tech-debt-report
          path: tech-debt-report.txt

  # ── Dead feature flag detection ────────────────────────────────────
  # Checks that each FeatureFlag variant in feature_flags.rs is referenced
  # somewhere in the codebase beyond its definition.
  dead-feature-flag-detection:
    name: Dead Feature Flag Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for unreferenced feature flags
        run: |
          set -e
          DEAD=0
          for flag in NeuralSearch RemoteEmbeddings CrossLanguageResolution ExperimentalHnsw StreamingMcp GlobalAutoSync; do
            # Count references outside the definition in feature_flags.rs
            REFS=$(grep -rIn --include='*.rs' "FeatureFlag::$flag" src/ 2>/dev/null | grep -v 'src/feature_flags.rs' | wc -l)
            if [ "$REFS" -eq 0 ]; then
              echo "::warning::FeatureFlag::$flag is defined but never used outside feature_flags.rs"
              DEAD=$((DEAD + 1))
            else
              echo "FeatureFlag::$flag: $REFS references"
            fi
          done
          if [ "$DEAD" -gt 0 ]; then
            echo "::warning::$DEAD dead feature flag(s) detected"
          else
            echo "All feature flags are referenced."
          fi
