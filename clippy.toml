# Clippy configuration file.
#
# Lint *levels* (allow/deny/warn) no longer belong here: clippy 1.96+
# rejects the legacy top-level `allow = [...]`, `deny = [...]`, and
# `warn = [...]` array syntax. Per the Cargo `[lints]` RFC, lint levels
# are now declared in `Cargo.toml` under the `[workspace.lints.clippy]`
# table (see root `Cargo.toml`) and inherited by each workspace member via
# `[lints] workspace = true`.
#
# This file is reserved for clippy *configuration thresholds* only
# (e.g. `too-many-arguments-threshold`, `type-complexity-threshold`,
# `msrv`).

# ── Cognitive complexity threshold ───────────────────────────────────
# Enforces a maximum cognitive complexity per function via clippy's
# `cognitive_complexity` lint (active in the complexity group).
# Functions exceeding the threshold trigger a warning that must be
# refactored or explicitly allowed with #[allow(clippy::cognitive_complexity)].
# Default is 25; we allow 30 to accommodate CLI handlers with rich context.
cognitive-complexity-threshold = 30

# ── Other quality thresholds ────────────────────────────────────────

# Max arguments per function before `too_many_arguments` triggers.
# Set higher than default (7) to accommodate CLI handlers with rich context.
too-many-arguments-threshold = 10

# Max enum variant body size before `large_enum_variant` triggers (in bytes).
enum-variant-size-threshold = 200

# Max single-char binding names in a scope.
single-char-binding-names-threshold = 4

# MSRV for lint compatibility.
#
# Deliberately BELOW `rust-version` in Cargo.toml (1.88), and clippy reports
# that gap on every run. The gap is real and measured: linting AT the declared
# floor of 1.88 turns 366 pre-existing call sites into hard errors under
# `-D warnings` (356 `collapsible_if` let-chains, 6 `chunks_exact` with a
# constant size, 4 manual `.is_multiple_of()`). Re-measured with
# `cargo clippy --lib --message-format=short` on 2026-10-25. 1.88 is not a
# style preference here — it is the ratatui 0.30 floor.
#
# Two honest ways to remove the notice, neither of which belongs in a TUI
# change: migrate the 366 sites to the 1.88 idioms, or drop the `tui` feature.
# Leaving the notice visible is the deliberate choice, because silently
# linting against a toolchain the crate cannot build on would hide exactly
# the migration this comment is documenting.
#
# Tracked as https://github.com/scooter-lacroix/LeIndex/issues/104, whose
# acceptance criterion is these counts reaching zero. The counts were
# re-verified on 2026-10-26 by running clippy with `CLIPPY_CONF_DIR` pointed at
# a throwaway clippy.toml with `msrv = "1.88"`: 366 total, 120 files, matching
# the split above exactly.
#
# The migration must be MANUAL and per-site: collapsing a nested `if` into a
# let-chain changes drop order and short-circuit semantics where the inner
# condition has side effects, so an automated `cargo clippy --fix` sweep across
# all 366 sites is explicitly not an acceptable fix.
msrv = "1.85"
